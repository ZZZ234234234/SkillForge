name: Release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        run: npm ci
      - if: steps.version.outputs.exists == 'false'
        run: npm run typecheck
      - if: steps.version.outputs.exists == 'false'
        run: npm run lint
      - if: steps.version.outputs.exists == 'false'
        run: npm test
      - if: steps.version.outputs.exists == 'false'
        run: npm run build
      - if: steps.version.outputs.exists == 'false'
        run: npm run test:integration
      - if: steps.version.outputs.exists == 'false'
        run: npm run release:package
      - name: Attest release archives
        if: steps.version.outputs.exists == 'false'
        uses: actions/attest@v4
        with:
          subject-path: release/*.zip
      - name: Publish verified artifacts
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "SkillForge $RELEASE_TAG" --notes-file docs/RELEASE-v0.1.0.md
