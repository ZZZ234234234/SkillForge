name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, passwords, cookies or private files.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Steps to reproduce, expected and actual behavior, browser and version.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Evidence and verification
      description: Include actual results and note what remains unverified.
