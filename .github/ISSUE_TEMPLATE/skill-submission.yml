name: Skill submission
description: Propose a new original skill.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, passwords, cookies or private files.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Use case, source, author, license, workflow and test examples.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Evidence and verification
      description: Include actual results and note what remains unverified.
