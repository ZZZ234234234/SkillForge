name: Compatibility issue
description: Report a platform import or export issue.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, passwords, cookies or private files.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Platform/version, adapter, minimal redacted skill and actual error.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Evidence and verification
      description: Include actual results and note what remains unverified.
