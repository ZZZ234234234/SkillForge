name: Registry submission
description: Request review of a registry contribution.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, passwords, cookies or private files.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Package path, category, license, compatibility claims and validation results.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Evidence and verification
      description: Include actual results and note what remains unverified.
